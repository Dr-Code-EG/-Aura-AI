name: Build Dr Code (Windows)

# Builds a single-folder Windows .exe of Dr Code on every push to
# the default branch and on every manual run. The .exe is uploaded
# as a CI artifact, and (for tag pushes like v1.0.0) attached to a
# GitHub Release. A rolling pre-release at the `latest-windows` tag
# always points at the most recent build of the default branch.

on:
  push:
    branches:
      - "main"
      - "master"
    tags:
      - "v*.*.*"
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop_app/**"
      - "drcode.py"
      - "drcode.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DrCode.exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm drcode.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DrCode\DrCode.exe")) {
            throw "DrCode.exe was not produced."
          }
          # Sanity-check that the QtWebEngine runtime files actually
          # got bundled — if they didn't, the embedded ChatGPT browser
          # would load as a blank page at runtime.
          $needle = Get-ChildItem -Path "dist\DrCode" -Recurse -Filter "QtWebEngineProcess.exe" -ErrorAction SilentlyContinue
          if (-not $needle) {
            throw "QtWebEngineProcess.exe missing — embedded browser will not work."
          }
          $icu = Get-ChildItem -Path "dist\DrCode" -Recurse -Filter "icudtl.dat" -ErrorAction SilentlyContinue
          if (-not $icu) {
            throw "icudtl.dat missing — Chromium will fail to start."
          }

      - name: Bundle as zip
        shell: pwsh
        run: |
          $rawVersion = "$env:GITHUB_REF_NAME"
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            $rawVersion = "dev-$env:GITHUB_RUN_NUMBER"
          }
          $version = $rawVersion -replace '[^A-Za-z0-9_.-]', '-'
          $zip = "DrCode-windows-$($version).zip"
          Compress-Archive -Path "dist\DrCode\*" -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Built artifact: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrCode-windows
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling pre-release
        if: |
          (
            github.event_name == 'push' || github.event_name == 'workflow_dispatch'
          ) && (
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/master'
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: "Dr Code — latest Windows build"
          body: |
            Latest Windows build of Dr Code.

            **How to use:**
            1. Download the `.zip` below.
            2. Unzip anywhere (e.g. `C:\Users\You\DrCode`).
            3. Double-click `DrCode.exe` — a small clock window
               appears.
            4. The first time, **right-click the clock face** and
               choose **Sign in** to log in to ChatGPT, then
               right-click again and choose **Hide clock face**.
            5. **Left-click the clock face** (or press
               `Ctrl+Shift+A`) while your question is on screen.
               The answer appears in the clock's title bar.
          prerelease: true
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
