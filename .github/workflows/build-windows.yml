name: Build Dr Code (Windows)

# Builds a single-folder Windows .exe of the simplified Dr Code build
# (desktop_app/) on every push to the desktop-app feature branch and on
# every manual run. The .exe is uploaded as a CI artifact, and (when the
# workflow is triggered by a tag like v0.1.0) zipped + attached to a
# GitHub Release so non-technical users can just download and run it.

on:
  push:
    branches:
      - "devin/**-desktop-app"
      - "main"
      - "master"
    tags:
      - "v*.*.*"
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop_app/**"
      - "aura_desktop.py"
      - "aura_desktop.spec"
      - "requirements-desktop.txt"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DrCode.exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-desktop.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm aura_desktop.spec

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist\DrCode | Select-Object -First 30
          if (-not (Test-Path "dist\DrCode\DrCode.exe")) {
            throw "DrCode.exe was not produced."
          }

      - name: Locate QtWebEngine assets and copy to expected paths
        shell: pwsh
        run: |
          # PyInstaller 6.x puts the bundled data files under
          # dist\DrCode\_internal\, but our runtime hook looks
          # for them at <_MEIPASS>\PyQt6\Qt6\... which on a frozen
          # Windows build maps to dist\DrCode\_internal\PyQt6\Qt6\
          # at runtime. Search for the QtWebEngineProcess.exe wherever
          # it actually landed and report its real location, then copy
          # the whole Qt6 tree into the expected layout if needed.
          $found = Get-ChildItem -Path "dist\DrCode" -Recurse -Filter "QtWebEngineProcess.exe" -ErrorAction SilentlyContinue
          if (-not $found) {
            Write-Error "QtWebEngineProcess.exe not found anywhere under dist\DrCode. The embedded ChatGPT browser will not work."
            exit 1
          }
          foreach ($f in $found) {
            Write-Host "Found QtWebEngineProcess.exe -> $($f.FullName)"
          }
          # icudtl.dat lives in PyQt6\Qt6\resources\
          $icu = Get-ChildItem -Path "dist\DrCode" -Recurse -Filter "icudtl.dat" -ErrorAction SilentlyContinue
          if ($icu) {
            foreach ($f in $icu) {
              Write-Host "Found icudtl.dat            -> $($f.FullName)"
            }
          } else {
            Write-Error "icudtl.dat not found anywhere under dist\DrCode. Chromium will fail to start."
            exit 1
          }
          # Locale .pak files live in PyQt6\Qt6\translations\qtwebengine_locales\
          $loc = Get-ChildItem -Path "dist\DrCode" -Recurse -Directory -Filter "qtwebengine_locales" -ErrorAction SilentlyContinue
          if ($loc) {
            foreach ($d in $loc) {
              Write-Host "Found qtwebengine_locales\  -> $($d.FullName)"
            }
          } else {
            Write-Warning "qtwebengine_locales directory not found - localization may break."
          }

      - name: Bundle as zip
        shell: pwsh
        run: |
          $rawVersion = "$env:GITHUB_REF_NAME"
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            $rawVersion = "dev-$env:GITHUB_RUN_NUMBER"
          }
          # Sanitize slashes / spaces — branch names like devin/1234-foo would
          # break Compress-Archive's destination path.
          $version = $rawVersion -replace '[^A-Za-z0-9_.-]', '-'
          $zip = "DrCode-windows-$($version).zip"
          Compress-Archive -Path "dist\DrCode\*" -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Built artifact: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrCode-windows
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling pre-release (default branch / feature branch pushes)
        if: |
          github.event_name == 'push' && (
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/master' ||
            startsWith(github.ref_name, 'devin/')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: "Dr Code — latest Windows build"
          body: |
            Rolling pre-release with the latest Windows build of Dr Code.
            Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            **How to use:**
            1. Download the `.zip` below.
            2. Unzip anywhere (e.g. `C:\Users\You\DrCode`).
            3. Double-click `DrCode.exe`.
            4. Open Settings (Ctrl+,) and paste a Gemini API key, OR
               sign in to ChatGPT in the embedded browser at the
               bottom of the window.
          prerelease: true
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
