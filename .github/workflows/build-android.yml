name: Build AuraAndroid APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Stage APK with sanitized name
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          raw_ref="${GITHUB_REF_NAME:-dev-${GITHUB_RUN_NUMBER}}"
          # Sanitize for filenames (drop slashes, etc.).
          version="$(echo "$raw_ref" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          src="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "Release APK not found at $src" >&2
            ls -R android/app/build/outputs || true
            exit 1
          fi
          out="AuraAI-android-${version}.apk"
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "Built artifact: $out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.apk }}
          path: ${{ steps.stage.outputs.apk }}

      - name: Publish release (rolling on branches, stable on tags)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-android' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Aura AI Android — latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: ${{ steps.stage.outputs.apk }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
