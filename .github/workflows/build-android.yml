name: Build Dr Code (Android)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease :admin:assembleRelease

      - name: Stage APKs
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          user_src="android/app/build/outputs/apk/release/app-release.apk"
          admin_src="android/admin/build/outputs/apk/release/admin-release.apk"
          for f in "$user_src" "$admin_src"; do
            if [ ! -f "$f" ]; then
              echo "APK not found: $f" >&2
              ls -R android/app/build/outputs android/admin/build/outputs || true
              exit 1
            fi
          done
          cp "$user_src"  DrCode-android.apk
          cp "$admin_src" DrCode-admin-android.apk
          echo "user_apk=DrCode-android.apk"   >> "$GITHUB_OUTPUT"
          echo "admin_apk=DrCode-admin-android.apk" >> "$GITHUB_OUTPUT"

      - name: Upload user artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrCode-android
          path: ${{ steps.stage.outputs.user_apk }}

      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrCode-admin-android
          path: ${{ steps.stage.outputs.admin_apk }}

      - name: Publish release
        if: |
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-android' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Dr Code Android — latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Dr Code for Android.

            **User APK** (`DrCode-android.apk`)
              The clock-disguised assistant. Activation code required.

            **Admin APK** (`DrCode-admin-android.apk`)
              Sign in with your Firebase Auth admin account to mint
              activation codes, view registered devices, and
              block / unblock users.
          files: |
            ${{ steps.stage.outputs.user_apk }}
            ${{ steps.stage.outputs.admin_apk }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
