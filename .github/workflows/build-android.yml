name: Build Dr Code (Android)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Stage APK
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          src="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "Release APK not found at $src" >&2
            ls -R android/app/build/outputs || true
            exit 1
          fi
          out="DrCode-android.apk"
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrCode-android
          path: ${{ steps.stage.outputs.apk }}

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-android' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Dr Code Android — latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Dr Code for Android.

            Install:
            1. Download `DrCode-android.apk` below.
            2. Open it on your phone — allow "Install unknown apps" if prompted.
            3. Open the app, tap **Sign in** once, log in.
            4. Tap **Start clock face** — a small analog clock floats over other apps.
            5. Tap the clock to ask about whatever is on screen.
          files: ${{ steps.stage.outputs.apk }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
